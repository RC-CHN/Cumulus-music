name: Watchman Windows reference

# Manual only. Collects real WebView2 fingerprint references on a Windows runner,
# so the Linux side has something to compare against instead of guessing. Two runs
# per dispatch: the untouched engine, and the research engine mask that rewrites
# Function.prototype.toString so `eval.toString()` reports Chromium's native form.
# The mask changes page identity and must never reach production paths.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-reference:
    name: Windows fingerprint reference
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - name: Restore cargo registry and build products
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target/debug/.fingerprint
            .build/target/debug/build
          key: rust-windows-2022-watchman-reference-v1-${{ hashFiles('.cargo/config.toml', 'rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            rust-windows-2022-watchman-reference-v1-${{ hashFiles('.cargo/config.toml', 'rust-toolchain.toml') }}-
      - name: Build the frontend assets the webview embeds
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build the fingerprint probe
        env:
          CARGO_BUILD_JOBS: '3'
        run: cargo build -p cumulus-desktop --features custom-protocol --locked --example watchman_fingerprint_probe
      - name: Measure the native Windows engine
        run: python scripts/ci/watchman_reference.py --binary .build/target/debug/examples/watchman_fingerprint_probe.exe --root .build/watchman-reference/native
      - name: Measure with the engine mask enabled
        env:
          CUMULUS_PROOF_ENGINE_MASK: '1'
        run: python scripts/ci/watchman_reference.py --binary .build/target/debug/examples/watchman_fingerprint_probe.exe --root .build/watchman-reference/engine-mask
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: watchman-windows-reference-attempt-${{ github.run_attempt }}
          path: .build/watchman-reference/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # The binary is the only artifact that cannot be rebuilt on a machine without
      # a Rust toolchain, so a real desktop can run it directly over SSH.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watchman-windows-probe-exe-attempt-${{ github.run_attempt }}
          path: .build/target/debug/examples/watchman_fingerprint_probe.exe
          if-no-files-found: error
          retention-days: 7
