      - name: Archive synthetic failure diagnostics
        if: failure()
        run: python scripts/ci/diagnostics.py
      - name: Preserve synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}
          # Archive first: path-escaping fixtures deliberately contain colons,
          # which upload-artifact cannot accept as individual filenames.
          include-hidden-files: true
          path: .build/diagnostics/synthetic-proofs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}
          path: .build/packages/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve Rust caches for the next attempt
        if: >-
          always() && !cancelled() && steps.rust-cache.outcome == 'success' &&
          steps.rust-cache.outputs.cache-hit != 'true' &&
          (steps.rust-clippy.outcome == 'success' || steps.rust-clippy.outcome == 'failure') &&
          hashFiles('.build/target/.rustc_info.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.rust-target-cache }}
          key: rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}${{ runner.os == 'Windows' && format('-{0}', github.sha) || '' }}

  linux-webview:
    name: Linux WebView smoke
    needs: [frontend, native-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libmpv-dev ffmpeg xvfb dbus-x11 python3-gi gir1.2-gtk-3.0 libxtst6 openbox iproute2 openssl
          sudo locale-gen en_US.UTF-8
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          # Linux reuses downloads only, never a target directory.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-Linux-downloads-v2-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Same workflow run; no external run ID or cache lookup.
          name: linux-webview-package-filter
          path: .build/package-stage/linux-x64/native
      - name: Require packaged filter and measure Linux WebView disk
        run: |
          test -f frontend/dist/index.html
          test -s .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
          test ! -d .build/target
          df -h .
      - name: Linux WebView login lifecycle smoke
        # Start Xvfb before the private bus so activated GTK/AT-SPI services inherit DISPLAY.
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cargo build -p cumulus-desktop --example native_audio_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe --report .build/ci-native-audio-linux.json
          cargo build -p cumulus-desktop --example main_flow_ui_probe --features custom-protocol --locked
          python3 scripts/ci/main_flow_https_smoke.py --eof-next --binary .build/target/debug/examples/main_flow_ui_probe --root .build/ci-main-flow-linux
          python3 scripts/ci/main_flow_https_smoke.py --retry-once --binary .build/target/debug/examples/main_flow_ui_probe --root .build/ci-main-flow-retry-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe --report .build/ci-native-audio-loudness-linux.json --filter-library .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
          CUMULUS_PROOF_EFFECT_FILTER="$PWD/.build/package-stage/linux-x64/native/libcumulus_audio_filter.so" cargo test -p cumulus-core --lib --locked native_reserved_geq_preserves_loudness_and_peq_instances -- --ignored
