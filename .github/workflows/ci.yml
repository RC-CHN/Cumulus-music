name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_diagnostic:
        description: Also compare Windows device enumeration through Rust and upstream APIs
        type: boolean
        default: false
      windows_smtc_diagnostic:
        description: Also verify Windows SMTC through an independent OS session consumer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Preserve each main SHA's evidence/cache; superseded PR runs may be cancelled.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  # Runner logs collect redirected Python output; Windows must not use CP1252.
  PYTHONIOENCODING: utf-8

jobs:
  smtc-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_smtc_diagnostic
    uses: ./.github/workflows/windows-smtc-diagnostic.yml
  media-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_diagnostic
    uses: ./.github/workflows/windows-media-diagnostic.yml
  frontend:
    name: Frontend and release rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 scripts/ci/source_audit.py
      - run: python3 scripts/ci/release_guard.py
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: node --test desktop/tests/watchman_environment.cjs desktop/tests/watchman_compatibility.cjs
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  native-linux:
    # Keep the established required job context used by the release verifier.
    name: Native (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libmpv-dev ffmpeg xvfb dbus-x11 python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core libxtst6 openbox x11-utils iproute2 pipewire pipewire-pulse wireplumber pulseaudio-utils desktop-file-utils
          sudo locale-gen en_US.UTF-8
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          # Linux reuses downloads only, never a target directory.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-Linux-downloads-v2-
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cargo fmt --all --check
      - id: rust-clippy
        run: cargo clippy --keep-going --workspace --all-targets --features cumulus-desktop/custom-protocol --locked -- -D warnings
      - run: cargo test --no-fail-fast --workspace --all-targets --features cumulus-desktop/custom-protocol --locked
      - name: Verify native streaming cache with generated audio
        run: |
          fixture="$RUNNER_TEMP/cumulus-stream-cache-fixture.mp3"
          ffmpeg -hide_banner -loglevel error -nostdin -f lavfi -i 'sine=frequency=439:sample_rate=44100:duration=3.8' -c:a libmp3lame -b:a 192k "$fixture"
          CUMULUS_PROOF_STREAM_MP3="$fixture" cargo test --locked -p cumulus-core --lib actual_native_streaming_cache_reauthorizes_each_play -- --ignored
      - name: Verify optional song fingerprint features
        run: cargo test --locked -p cumulus-core --lib --features song-recognition-zlib,song-recognition-resampler song_recognition
      - name: Verify Linux recognition device binding
        run: cargo test --locked -p cumulus-desktop --lib --features custom-protocol,recognition-monitor-lab recognition_capture
      - name: Verify standalone WASAPI capture policy
        run: cargo test --locked --manifest-path desktop/probes/recognition-wasapi/Cargo.toml
      - name: Archive synthetic failure diagnostics
        if: failure()
        run: python scripts/ci/diagnostics.py
      - name: Upload synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-linux-native-checks
          include-hidden-files: true
          path: .build/diagnostics/synthetic-proofs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Rust downloads for the next attempt
        if: >-
          always() && !cancelled() && steps.rust-cache.outcome == 'success' &&
          steps.rust-cache.outputs.cache-hit != 'true' &&
          (steps.rust-clippy.outcome == 'success' || steps.rust-clippy.outcome == 'failure')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  package-linux:
    name: Package and verify (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libmpv-dev ffmpeg xvfb dbus-x11 python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core libxtst6 openbox x11-utils iproute2 pipewire pipewire-pulse wireplumber pulseaudio-utils desktop-file-utils cmake binutils
          sudo locale-gen en_US.UTF-8
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          # Linux reuses downloads only, never a target directory.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-Linux-downloads-v2-
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Check Linux package build space
        run: |
          # This runner only builds the release profile; native tests run independently.
          test ! -d .build/target/debug
          df -h .
      - name: Build release packages and verify native media
        run: python scripts/ci/package.py --platform linux-x64
      - name: Verify the release graphics startup
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_FORCE_DMABUF_RENDERER: '1'
          WEBKIT_DMABUF_RENDERER_FORCE_SHM: '1'
        run: |
          xvfb-run -a dbus-run-session -- python3 scripts/ci/graphics_smoke.py --binary .build/target/release/cumulus --root .build/ci-graphics-linux
      - name: Verify playback and EQ in the extracted Debian application
        run: |
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
            env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 /usr/bin/python3 scripts/ci/installed_linux_smoke.py --packages .build/packages/linux-x64 --filter .build/package-stage/linux-x64/native/libcumulus_audio_filter.so --commit "$GITHUB_SHA" --ci-run "$GITHUB_RUN_ID" --ci-attempt "$GITHUB_RUN_ATTEMPT" --root .build/ci-installed-linux --verify-local-playback --verify-installed-equalizer --verify-monitor-pcm --verify-packaged-flac
      - name: Verify continuous indexed FLAC output in the Linux Debian package
        run: |
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
            env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 /usr/bin/python3 scripts/ci/installed_linux_smoke.py --packages .build/packages/linux-x64 --filter .build/package-stage/linux-x64/native/libcumulus_audio_filter.so --commit "$GITHUB_SHA" --ci-run "$GITHUB_RUN_ID" --ci-attempt "$GITHUB_RUN_ATTEMPT" --root .build/ci-installed-indexed-flac-linux --verify-local-playback --verify-monitor-pcm --verify-packaged-flac --verify-indexed-flac-equalizer --indexed-flac-block-size 4608 --verify-indexed-playback-speeds
      - name: Verify playback and EQ in the Linux portable archive
        run: |
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
            env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 /usr/bin/python3 scripts/ci/installed_linux_smoke.py --packages .build/packages/linux-x64 --filter .build/package-stage/linux-x64/native/libcumulus_audio_filter.so --commit "$GITHUB_SHA" --ci-run "$GITHUB_RUN_ID" --ci-attempt "$GITHUB_RUN_ATTEMPT" --root .build/ci-portable-linux --portable --verify-local-playback --verify-installed-equalizer --verify-monitor-pcm --verify-packaged-flac
      - name: Verify registered Linux startup and tray recovery
        run: |
          outer_network=$(readlink /proc/self/ns/net)
          proof_home=$(mktemp -d)
          sudo unshare --net --fork --kill-child sh -ec '
            test "$(readlink /proc/self/ns/net)" != "$1"
            target_user=$2
            shift 2
            ip link set lo up
            exec runuser -u "$target_user" -- "$@"
          ' sh "$outer_network" "$(id -un)" env -i HOME="$proof_home" PATH=/usr/bin:/usr/sbin \
            GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 xvfb-run -a -s '-screen 0 1440x1020x24 -nolisten tcp' \
            dbus-run-session -- /usr/bin/python3 scripts/ci/tray_protocol_smoke.py --startup \
            --screenshots --outer-network "$outer_network" --binary .build/target/release/cumulus --root .build/ci-autostart-linux
      - name: Verify native audio opening and Debian file candidates
        run: |
          outer_network=$(readlink /proc/self/ns/net)
          proof_home=$(mktemp -d)
          isolated_desktop() {
            sudo unshare --net --fork --kill-child sh -ec '
              test "$(readlink /proc/self/ns/net)" != "$1"
              target_user=$2
              shift 2
              ip link set lo up
              exec runuser -u "$target_user" -- "$@"
            ' sh "$outer_network" "$(id -un)" env -i HOME="$proof_home" PATH=/usr/bin:/usr/sbin \
              GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 xvfb-run -a -s '-screen 0 1440x1020x24 -nolisten tcp' \
              dbus-run-session -- "$@"
          }
          isolated_desktop /usr/bin/python3 scripts/ci/native_file_open_smoke.py \
            --outer-network "$outer_network" --binary .build/target/release/cumulus --root .build/ci-native-open-linux
          isolated_openbox() {
            # The nested shell expands its private HOME and owns the window manager.
            # shellcheck disable=SC2016
            isolated_desktop sh -ec '
              openbox > "$HOME/openbox.log" 2>&1 &
              manager=$!
              cleanup() { kill "$manager" 2>/dev/null || true; }
              trap cleanup EXIT
              "$@"
            ' sh "$@"
          }
          isolated_openbox /usr/bin/python3 scripts/ci/native_warm_file_open_smoke.py \
            --outer-network "$outer_network" --binary .build/target/release/cumulus --root .build/ci-native-warm-open-linux
          shopt -s nullglob
          debs=(.build/packages/linux-x64/*.deb)
          test "${#debs[@]}" -eq 1
          isolated_openbox /usr/bin/python3 scripts/ci/linux_file_candidate_smoke.py \
            --outer-network "$outer_network" --deb "${debs[0]}" --root .build/ci-file-candidate-linux
      - name: Archive synthetic failure diagnostics
        if: failure()
        run: python scripts/ci/diagnostics.py
      - name: Upload synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-linux-x64
          include-hidden-files: true
          path: .build/diagnostics/synthetic-proofs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-linux-x64
          path: .build/packages/linux-x64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Export the exact packaged Linux filter and FLAC decoder for WebView smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-webview-package-runtime
          path: |
            .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
            .build/package-stage/linux-x64/native/libcumulus_flac150.so.14
            .build/package-stage/linux-x64/native/third-party/licenses/flac-1.5.0/COPYING.Xiph
          if-no-files-found: error
          retention-days: 3
      - name: Export the corresponding Linux package attestation for WebView smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-webview-package-manifest
          path: .build/packages/linux-x64/manifest-linux-x64.json
          if-no-files-found: error
          retention-days: 3

  native:
    name: Native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            rust-cache-scheme: v1
            rust-target-cache: .build/target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Windows media dependencies
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ladspa-sdk
      - name: Install pinned toolchain
        run: rustup show
      - name: Observe Windows identity encoding with synthetic inputs
        if: runner.os == 'Windows'
        run: |
          mkdir -p .build/windows-identity-encoding
          rustc --edition 2024 -D warnings scripts/research/windows_identity_encoding_probe.rs -o .build/windows-identity-encoding/probe.exe
          .build/windows-identity-encoding/probe.exe
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.rust-target-cache }}
          # Windows retains its target cache; both Linux jobs only restore downloads.
          key: rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}${{ runner.os == 'Windows' && format('-{0}', github.sha) || '' }}
          restore-keys: |
            rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-
      - name: Build and verify Windows media runtime
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-media
        with:
          msys-root: ${{ steps.msys2.outputs.msys2-location }}
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cargo fmt --all --check
      - id: rust-clippy
        run: cargo clippy --keep-going --workspace --all-targets --features cumulus-desktop/custom-protocol --locked -- -D warnings
      - run: cargo test --no-fail-fast --workspace --all-targets --features cumulus-desktop/custom-protocol --locked
      - name: Verify optional song fingerprint features
        run: cargo test --locked -p cumulus-core --lib --features song-recognition-zlib,song-recognition-resampler song_recognition
      - name: Verify standalone WASAPI capture policy
        run: cargo test --locked --manifest-path desktop/probes/recognition-wasapi/Cargo.toml
      - name: Archive synthetic failure diagnostics
        if: failure()
        run: python scripts/ci/diagnostics.py
      - name: Preserve synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-windows-native-checks
          # Archive first: path-escaping fixtures deliberately contain colons,
          # which upload-artifact cannot accept as individual filenames.
          include-hidden-files: true
          path: .build/diagnostics/synthetic-proofs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Rust caches for the next attempt
        if: >-
          always() && !cancelled() && steps.rust-cache.outcome == 'success' &&
          steps.rust-cache.outputs.cache-hit != 'true' &&
          (steps.rust-clippy.outcome == 'success' || steps.rust-clippy.outcome == 'failure') &&
          hashFiles('.build/target/.rustc_info.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.rust-target-cache }}
          key: rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}${{ runner.os == 'Windows' && format('-{0}', github.sha) || '' }}

  package-windows:
    name: Package and verify (windows-x64)
    runs-on: windows-2022
    # Packaging and GUI probes use the same verified media staging directory.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Windows media dependencies
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ladspa-sdk
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target
          # Restore only. The Native Windows job owns Rust target cache writes.
          key: rust-${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-v1-
      - name: Build and verify Windows media runtime
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-media
        with:
          msys-root: ${{ steps.msys2.outputs.msys2-location }}
          save-cache: 'false'
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Build release packages and verify native media
        env:
