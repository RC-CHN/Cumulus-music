name: CI
run-name: Compare Windows process code pages (synthetic only)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows-codepages:
    name: Windows default and UTF-8 encoding
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - name: Compile two processes from the same fixed-input Rust probe
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          mkdir -p .build/identity-encoding-compare
          src=scripts/research/windows_identity_encoding_probe.rs
          rustc --edition 2024 -D warnings "$src" -o .build/identity-encoding-compare/default.exe
          rustc --edition 2024 -D warnings "$src" -o .build/identity-encoding-compare/utf8.exe \
            -C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:scripts/research/windows_identity_utf8.manifest
      - name: Verify active code pages and record the fixed buffer cases
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          for label in ('default', 'utf8'):
              binary = Path('.build/identity-encoding-compare', label + '.exe').resolve()
              output = subprocess.check_output([binary], text=True, encoding='ascii', timeout=15)
              lines = output.splitlines()
              assert lines and lines[0].startswith('encoding_probe=v1 get_acp=')
              observed = int(lines[0].split('=')[-1])
              assert (observed == 65001) == (label == 'utf8'), f'unexpected process ACP for {label}: {observed}'
              assert lines[-1] == 'encoding_probe=complete synthetic_only=true hardware_reads=0'
              print(f'--- {label} process ---')
              print(output, end='')
          PY
