name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_diagnostic:
        description: Also compare Windows device enumeration through Rust and upstream APIs
        type: boolean
        default: false
      windows_smtc_diagnostic:
        description: Also verify Windows SMTC through an independent OS session consumer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Preserve each main SHA's evidence/cache; superseded PR runs may be cancelled.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  smtc-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_smtc_diagnostic
    uses: ./.github/workflows/windows-smtc-diagnostic.yml
  media-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_diagnostic
    uses: ./.github/workflows/windows-media-diagnostic.yml
  frontend:
    name: Frontend and release rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 scripts/ci/source_audit.py
      - run: python3 scripts/ci/release_guard.py
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: node --test desktop/tests/watchman_environment.cjs desktop/tests/watchman_compatibility.cjs
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libmpv-dev ffmpeg xvfb dbus-x11 python3-gi gir1.2-gtk-3.0 libxtst6
          sudo locale-gen en_US.UTF-8
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Windows media dependencies
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ladspa-sdk
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target
          key: rust-${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-v1-
      - name: Build and verify Windows media runtime
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-media
        with:
          msys-root: ${{ steps.msys2.outputs.msys2-location }}
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cargo fmt --all --check
      - id: rust-clippy
        run: cargo clippy --keep-going --workspace --all-targets --features cumulus-desktop/custom-protocol --locked -- -D warnings
      - run: cargo test --no-fail-fast --workspace --all-targets --features cumulus-desktop/custom-protocol --locked
      - name: Build release packages and verify native media
        env:
          CUMULUS_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python scripts/ci/package.py --platform '${{ matrix.platform }}'
      - name: Linux WebView login lifecycle smoke
        # Start Xvfb before the private bus so activated GTK/AT-SPI services inherit DISPLAY.
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cargo build -p cumulus-desktop --example native_audio_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe --report .build/ci-native-audio-linux.json
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe --report .build/ci-native-audio-loudness-linux.json --filter-library .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
          cargo build -p cumulus-desktop --example loudness_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/loudness_ui_smoke.py --binary .build/target/debug/examples/loudness_ui_probe --root .build/ci-loudness-ui-linux --filter-library .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
          cargo build -p cumulus-desktop --example login_interception_ui_probe --features custom-protocol --locked
          xvfb-run -a dbus-run-session -- /usr/bin/python3 desktop/examples/run_auth_probe.py .build/ci-login --binary .build/target/debug/examples/login_interception_ui_probe --stage-prefix interception_ --screenshots 4 --small
          python3 desktop/examples/audit_login_interception_probe.py .build/ci-login
          cargo build -p cumulus-desktop --example scroll_ui_probe --features custom-protocol --locked
          xvfb-run -a dbus-run-session -- python3 scripts/ci/scroll_smoke.py --binary .build/target/debug/examples/scroll_ui_probe --root .build/ci-scroll-linux
          cargo build -p cumulus-desktop --example ux_ui_probe --features custom-protocol --locked
          xvfb-run -a dbus-run-session -- python3 scripts/ci/ux_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-ux-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/download_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-download-layout-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/download_page_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-download-page-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/download_page_smoke.py --table --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-download-table-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/download_page_smoke.py --batch --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-download-batch-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/download_page_smoke.py --navigation --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-download-navigation-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/download_page_smoke.py --menu --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-download-menu-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/player_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-player-layout-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playback_speed_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playback-speed-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-layout-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_editor_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-editor-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_tags_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-tags-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_cover_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-cover-layout-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_cover_feedback_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-cover-feedback-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_cover_preview_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-cover-preview-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/search_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-search-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/search_results_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-search-results-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/search_cards_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-search-cards-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/search_preview_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-search-preview-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/search_lyrics_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-search-lyrics-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/song_menu_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-song-menu-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_collect_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-collect-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/library_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-library-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_menu_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-menu-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_queue_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-queue-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_batch_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-batch-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/playlist_batch_table_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-playlist-batch-table-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/sidebar_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-sidebar-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/search_scroll_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-search-scroll-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/like_recovery_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-likes-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/keyboard_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-keyboard-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/motion_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-motion-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/system_media_ui_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-system-media-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/shortcuts_ui_smoke.py --binary .build/target/debug/examples/ux_ui_probe --root .build/ci-shortcuts-ui-linux
          cargo build -p cumulus-desktop --example mini_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/mini_smoke.py --binary .build/target/debug/examples/mini_ui_probe --root .build/ci-mini-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/mini_smoke.py --binary .build/target/debug/examples/mini_ui_probe --root .build/ci-mini-shortcuts-linux --shortcuts
          cargo build -p cumulus-desktop --example desktop_lyrics_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/desktop_lyrics_smoke.py --binary .build/target/debug/examples/desktop_lyrics_ui_probe --root .build/ci-desktop-lyrics-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/fonts_smoke.py --binary .build/target/debug/examples/desktop_lyrics_ui_probe --root .build/ci-fonts-linux
          cargo build -p cumulus-desktop --example saved_accounts_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/accounts_smoke.py --binary .build/target/debug/examples/saved_accounts_ui_probe --root .build/ci-accounts-linux
          cargo build -p cumulus-desktop --example output_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/output_settings_smoke.py --binary .build/target/debug/examples/output_ui_probe --root .build/ci-output-settings-linux
          cargo build -p cumulus-desktop --example tray_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/ci/tray_protocol_smoke.py --lifecycle --binary .build/target/debug/examples/tray_ui_probe --root .build/ci-tray-linux
          cargo build -p cumulus-desktop --example mpris_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/ci/mpris_smoke.py --binary .build/target/debug/examples/mpris_probe --root .build/ci-mpris-linux
          cargo build -p cumulus-desktop --example shortcut_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- /usr/bin/python3 scripts/ci/shortcut_smoke.py --binary .build/target/debug/examples/shortcut_probe --root .build/ci-shortcuts-linux
          cargo build -p cumulus-desktop --example startup_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/startup_smoke.py --binary .build/target/debug/examples/startup_ui_probe --root .build/ci-startup-linux
          cargo build -p cumulus-desktop --example catalog_ui_probe --features custom-protocol --locked
          xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-catalog-linux
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-catalog-album-linux --album
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-catalog-artist-linux --artist
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-catalog-navigation-linux --navigation
          cargo build -p cumulus-desktop --example comment_edit_ui_probe --features custom-protocol --locked
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/comment_edit_smoke.py --binary .build/target/debug/examples/comment_edit_ui_probe --root .build/ci-comment-edit-linux
          xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-catalog-layout-linux --layout
          xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-collections-linux --collections
          xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-history-linux --history
          xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-settings-linux --settings
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-relay-linux --relay
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-relay-settings-linux --relay-settings
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-relay-publication-linux --relay-publication
          LC_ALL=en_US.UTF-8 xvfb-run -a dbus-run-session -- python3 scripts/ci/catalog_smoke.py --binary .build/target/debug/examples/catalog_ui_probe --root .build/ci-relay-recovery-linux --relay-recovery
          xvfb-run -a dbus-run-session -- python3 scripts/ci/graphics_smoke.py --binary .build/target/release/cumulus --root .build/ci-graphics-linux
      - name: Windows WebView login lifecycle smoke
        if: runner.os == 'Windows'
        run: |
          cargo build -p cumulus-desktop --example native_audio_probe --features custom-protocol --locked
          python scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe.exe --report .build/ci-native-audio-windows.json --runtime .build/package-stage/windows-x64/native
          python scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe.exe --report .build/ci-native-audio-loudness-windows.json --runtime .build/package-stage/windows-x64/native --filter-library .build/package-stage/windows-x64/native/cumulus_audio_filter.dll
          cargo build -p cumulus-desktop --example loudness_ui_probe --features custom-protocol --locked
          python scripts/ci/loudness_ui_smoke.py --binary .build/target/debug/examples/loudness_ui_probe.exe --root .build/ci-loudness-ui-windows --runtime .build/package-stage/windows-x64/native --filter-library .build/package-stage/windows-x64/native/cumulus_audio_filter.dll
          cargo build -p cumulus-desktop --example login_interception_ui_probe --features custom-protocol --locked
          python scripts/ci/ui_smoke.py --binary .build/target/debug/examples/login_interception_ui_probe.exe --root .build/ci-login-windows
          python scripts/ci/ui_smoke.py --binary .build/target/debug/examples/login_interception_ui_probe.exe --root .build/ci-login-windows-legacy --legacy
          cargo build -p cumulus-desktop --example scroll_ui_probe --features custom-protocol --locked
          python scripts/ci/scroll_smoke.py --binary .build/target/debug/examples/scroll_ui_probe.exe --root .build/ci-scroll-windows
          cargo build -p cumulus-desktop --example ux_ui_probe --features custom-protocol --locked
          python scripts/ci/ux_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-ux-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-layout-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-page-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --table --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-table-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --batch --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-batch-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --navigation --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-navigation-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --menu --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-menu-windows --runtime .build/package-stage/windows-x64/native
