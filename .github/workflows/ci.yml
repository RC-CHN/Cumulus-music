      - name: Archive synthetic failure diagnostics
        if: failure()
        run: python scripts/ci/diagnostics.py
      - name: Preserve synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}
          # Archive first: path-escaping fixtures deliberately contain colons,
          # which upload-artifact cannot accept as individual filenames.
          include-hidden-files: true
          path: .build/diagnostics/synthetic-proofs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}
          path: .build/packages/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve compiled dependencies for the next attempt
        if: >-
          always() && !cancelled() && steps.rust-cache.outcome == 'success' &&
          steps.rust-cache.outputs.cache-hit != 'true' &&
          (steps.rust-clippy.outcome == 'success' || steps.rust-clippy.outcome == 'failure') &&
          hashFiles('.build/target/.rustc_info.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target
          key: rust-${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}

  gate:
    name: CI gate
    if: always()
    needs: [frontend, native, media-diagnostic, smtc-diagnostic]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          FRONTEND: ${{ needs.frontend.result }}
          NATIVE: ${{ needs.native.result }}
          DIAGNOSTIC: ${{ needs.media-diagnostic.result }}
          DIAGNOSTIC_REQUESTED: ${{ inputs.windows_diagnostic || false }}
          SMTC: ${{ needs.smtc-diagnostic.result }}
          SMTC_REQUESTED: ${{ inputs.windows_smtc_diagnostic || false }}
        run: |
          test "$FRONTEND" = success && test "$NATIVE" = success
          if [ "$DIAGNOSTIC_REQUESTED" = true ]; then
            test "$DIAGNOSTIC" = success
          else
            test "$DIAGNOSTIC" = skipped
          fi
          if [ "$SMTC_REQUESTED" = true ]; then
            test "$SMTC" = success
          else
            test "$SMTC" = skipped
          fi
