        if: always()
        run: df -h .
      - name: Archive synthetic failure diagnostics
        if: failure()
        run: python scripts/ci/diagnostics.py
      - name: Upload synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-linux-webview
          include-hidden-files: true
          path: .build/diagnostics/synthetic-proofs.tar.gz
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [frontend, native-linux, native, package-linux, package-windows, linux-webview, media-diagnostic, smtc-diagnostic]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          FRONTEND: ${{ needs.frontend.result }}
          NATIVE: ${{ needs.native.result }}
          LINUX_NATIVE: ${{ needs.native-linux.result }}
          LINUX_PACKAGE: ${{ needs.package-linux.result }}
          WINDOWS_PACKAGE: ${{ needs.package-windows.result }}
          LINUX_WEBVIEW: ${{ needs.linux-webview.result }}
          DIAGNOSTIC: ${{ needs.media-diagnostic.result }}
          DIAGNOSTIC_REQUESTED: ${{ inputs.windows_diagnostic || false }}
          SMTC: ${{ needs.smtc-diagnostic.result }}
          SMTC_REQUESTED: ${{ inputs.windows_smtc_diagnostic || false }}
        run: |
          test "$FRONTEND" = success
          test "$NATIVE" = success
          test "$LINUX_NATIVE" = success
          test "$LINUX_PACKAGE" = success
          test "$WINDOWS_PACKAGE" = success
          test "$LINUX_WEBVIEW" = success
          if [ "$DIAGNOSTIC_REQUESTED" = true ]; then
            test "$DIAGNOSTIC" = success
          else
            test "$DIAGNOSTIC" = skipped
          fi
          if [ "$SMTC_REQUESTED" = true ]; then
            test "$SMTC" = success
          else
            test "$SMTC" = skipped
          fi
