name: CI
run-name: Windows identity metadata only (no release artifacts)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows-identity-offline:
    name: Windows read-only identity observations
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - name: Test and compile the local probes on Windows x86_64
        run: |
          cargo test --locked --manifest-path desktop/probes/windows-board-identity/Cargo.toml --target-dir .build/identity-board
          cargo build --locked --manifest-path desktop/probes/windows-board-identity/Cargo.toml --target-dir .build/identity-board --bins
          cargo test --locked --manifest-path desktop/probes/windows-mac/Cargo.toml --target-dir .build/identity-mac
          cargo build --locked --manifest-path desktop/probes/windows-mac/Cargo.toml --target-dir .build/identity-mac
          mkdir -p .build/identity-storage
          rustc --edition 2024 -D warnings --test scripts/research/windows_storage_descriptor_probe.rs -o .build/identity-storage/tests.exe
          .build/identity-storage/tests.exe
          rustc --edition 2024 -D warnings scripts/research/windows_storage_descriptor_probe.rs -o .build/identity-storage/probe.exe
      - name: Observe typed states without raw device values
        run: python scripts/research/windows_identity_offline_trial.py
