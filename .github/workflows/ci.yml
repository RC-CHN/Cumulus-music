name: CI
run-name: Windows retained RC account WebView replay

# Disposable validation branch only; no main, PR, release or build trigger.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  windows-retained-account:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1432308824' && github.ref == 'refs/heads/validation/phase237-windows-account-retained'
    name: Windows retained account WebView replay
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: producer
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: '16b444e256e3cfa52721405ea759ec99a45b279c'
          path: producer
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify original CI attempt, producer jobs and artifact identities
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $api = "repos/$env:GITHUB_REPOSITORY/actions"
          $trial = gh api "$api/runs/42718914161/attempts/1" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $trial.id -ne 42718914161 -or $trial.run_attempt -ne 1 -or
              $trial.workflow_id -ne 398042187 -or $trial.repository.id -ne 1432308824 -or
              $trial.head_repository.id -ne $trial.repository.id -or $trial.event -ne 'push' -or
              $trial.status -notin @('in_progress', 'completed') -or $trial.path -ne '.github/workflows/ci.yml' -or
              $trial.head_branch -ne 'main' -or $trial.head_sha -ne '16b444e256e3cfa52721405ea759ec99a45b279c') {
            throw 'Wrong producer attempt'
          }
          if ((git rev-parse HEAD) -ne $trial.head_sha) { throw 'Wrong producer checkout' }
          $jobs = @{
            '129507552048' = 'Windows release media runtime'
            '129508012464' = 'Windows WebView probe build'
          }
          $specs = @(
            @{ id=13719961335; job='129507552048'; name='windows-release-runtime-attempt-1'; bytes=96887672; sha='a30bcae17e93391651d1e67642d7db9bd6cc24c241e0f3a491be895b53769f60' }
            @{ id=13719539108; job='129508012464'; name='windows-webview-inputs-attempt-1'; bytes=36147058; sha='e1a78a28c1d4fbaf7188e42b21bac2ba39fa85a0d0282e6bbad45188e3202f9b' }
            @{ id=13719649189; job='129508012464'; name='windows-webview-probes-search-account-attempt-1'; bytes=476780018; sha='a06183bfa1ab9c14ff5882c448be628a496d4717b5293ea5086d105cd2231d01' }
          )
          foreach ($jobId in $jobs.Keys) {
            $job = gh api "$api/jobs/$jobId" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $job.id -ne [long]$jobId -or $job.run_id -ne $trial.id -or
                $job.run_attempt -ne 1 -or $job.head_sha -ne $trial.head_sha -or
                $job.name -ne $jobs[$jobId] -or $job.conclusion -ne 'success') {
              throw 'Wrong producer job'
            }
            $lines = @(gh api "$api/jobs/$jobId/logs" --allow-escape-sequences)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify retained producer uploads' }
            foreach ($spec in $specs | Where-Object { $_.job -eq $jobId }) {
              $pattern = 'Artifact ' + [regex]::Escape($spec.name) + '\.zip successfully finalized\. Artifact ID ' + $spec.id + '$'
              if (@($lines -match $pattern).Count -ne 1) { throw 'Wrong producer artifact upload' }
            }
          }
          foreach ($spec in $specs) {
            $artifact = gh api "$api/artifacts/$($spec.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $artifact.id -ne $spec.id -or $artifact.name -ne $spec.name -or
                $artifact.expired -ne $false -or $artifact.size_in_bytes -ne $spec.bytes -or
                $artifact.digest -ne "sha256:$($spec.sha)" -or $artifact.workflow_run.id -ne $trial.id -or
                $artifact.workflow_run.head_sha -ne $trial.head_sha -or
                $artifact.workflow_run.repository_id -ne $trial.repository.id -or
                $artifact.workflow_run.head_repository_id -ne $trial.repository.id) {
              throw 'Wrong retained artifact'
            }
            Write-Output "Verified artifact $($spec.id) $($spec.name)"
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: '42718914161'
          artifact-ids: '13719961335'
          github-token: ${{ github.token }}
          path: producer/.build/windows-release-runtime
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: '42718914161'
          artifact-ids: '13719539108'
          github-token: ${{ github.token }}
          path: producer/.build/windows-webview-inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: '42718914161'
          artifact-ids: '13719649189'
          github-token: ${{ github.token }}
          path: producer/.build/windows-webview-probes/search-account
          merge-multiple: true
      - name: Verify and restore the original frontend, runtime and test probes
        id: restore
        run: |
          export GITHUB_SHA=16b444e256e3cfa52721405ea759ec99a45b279c GITHUB_RUN_ID=42718914161 GITHUB_RUN_ATTEMPT=1
          python scripts/ci/windows_webview_inputs.py restore --shared-runtime .build/windows-release-runtime
          python scripts/ci/windows_webview_probes.py restore search-account
      - name: Replay the original account login regression
        run: python scripts/ci/account_login_smoke.py --binary .build/target/debug/examples/account_login_ui_probe.exe --root .build/ci-account-login-windows --runtime .build/package-stage/windows-x64/native
      - name: Replay the original account details timeout
        if: '!cancelled() && steps.restore.outcome == ''success'''
        run: python scripts/ci/account_login_smoke.py --binary .build/target/debug/examples/account_login_ui_probe.exe --root .build/ci-account-detail-windows --account-detail --runtime .build/package-stage/windows-x64/native
      - name: Archive allowlisted synthetic diagnostics
        id: diagnostics
        if: '!cancelled() && steps.restore.outcome == ''success'''
        run: python scripts/ci/diagnostics.py
      - name: Preserve synthetic proof receipts
        if: '!cancelled() && steps.diagnostics.outcome == ''success'''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-retained-account-webview-attempt-${{ github.run_attempt }}
          path: producer/.build/diagnostics/synthetic-proofs.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
