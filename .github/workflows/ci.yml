name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_diagnostic:
        description: Also compare Windows device enumeration through Rust and upstream APIs
        type: boolean
        default: false
      windows_smtc_diagnostic:
        description: Also verify Windows SMTC through an independent OS session consumer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Preserve each main SHA's evidence/cache; superseded PR runs may be cancelled.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  smtc-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_smtc_diagnostic
    uses: ./.github/workflows/windows-smtc-diagnostic.yml
  media-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_diagnostic
    uses: ./.github/workflows/windows-media-diagnostic.yml
  frontend:
    name: Frontend and release rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 scripts/ci/source_audit.py
      - run: python3 scripts/ci/release_guard.py
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: node --test desktop/tests/watchman_environment.cjs desktop/tests/watchman_compatibility.cjs
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  native-linux:
    # Keep the established required job context and package artifact name.
    name: Native (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libmpv-dev ffmpeg xvfb dbus-x11 python3-gi gir1.2-gtk-3.0 libxtst6 openbox x11-utils iproute2
          sudo locale-gen en_US.UTF-8
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          # Linux reuses downloads only, never a target directory.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-Linux-downloads-v2-
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cargo fmt --all --check
      - id: rust-clippy
        run: cargo clippy --keep-going --workspace --all-targets --features cumulus-desktop/custom-protocol --locked -- -D warnings
      - run: cargo test --no-fail-fast --workspace --all-targets --features cumulus-desktop/custom-protocol --locked
      - name: Reclaim Linux test build space before packaging
        run: |
          df -h .
          du -sh .build/target/debug
          cargo clean --profile dev --locked
          test ! -d .build/target/debug
          df -h .
      - name: Build release packages and verify native media
        run: python scripts/ci/package.py --platform linux-x64
      - name: Verify the release graphics startup
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a dbus-run-session -- python3 scripts/ci/graphics_smoke.py --binary .build/target/release/cumulus --root .build/ci-graphics-linux
      - name: Start the extracted Debian application
        run: |
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' dbus-run-session -- env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/python3 scripts/ci/installed_linux_smoke.py --packages .build/packages/linux-x64 --filter .build/package-stage/linux-x64/native/libcumulus_audio_filter.so --commit "$GITHUB_SHA" --root .build/ci-installed-linux
      - name: Archive synthetic failure diagnostics
        if: failure()
        run: python scripts/ci/diagnostics.py
      - name: Upload synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-linux-x64
          include-hidden-files: true
          path: .build/diagnostics/synthetic-proofs.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-linux-x64
          path: .build/packages/linux-x64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Export the exact packaged Linux filter for WebView smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-webview-package-filter
          path: .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
          if-no-files-found: error
          retention-days: 3
      - name: Preserve Rust downloads for the next attempt
        if: >-
          always() && !cancelled() && steps.rust-cache.outcome == 'success' &&
          steps.rust-cache.outputs.cache-hit != 'true' &&
          (steps.rust-clippy.outcome == 'success' || steps.rust-clippy.outcome == 'failure')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  native:
    name: Native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            rust-cache-scheme: v1
            rust-target-cache: .build/target
    runs-on: ${{ matrix.os }}
    # Windows' observed full run took ~120 minutes before the cache save;
    # individual WebView probes retain their own bounded timeouts.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Windows media dependencies
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ladspa-sdk
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.rust-target-cache }}
          # Windows retains its target cache; both Linux jobs only restore downloads.
          key: rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}${{ runner.os == 'Windows' && format('-{0}', github.sha) || '' }}
          restore-keys: |
            rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-${{ runner.os }}-${{ matrix.rust-cache-scheme }}-
      - name: Build and verify Windows media runtime
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-media
        with:
          msys-root: ${{ steps.msys2.outputs.msys2-location }}
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cargo fmt --all --check
      - id: rust-clippy
        run: cargo clippy --keep-going --workspace --all-targets --features cumulus-desktop/custom-protocol --locked -- -D warnings
      - run: cargo test --no-fail-fast --workspace --all-targets --features cumulus-desktop/custom-protocol --locked
      - name: Build release packages and verify native media
        env:
          CUMULUS_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python scripts/ci/package.py --platform '${{ matrix.platform }}'
      - name: Windows WebView login lifecycle smoke
        if: runner.os == 'Windows'
        run: |
          cargo build -p cumulus-desktop --example native_audio_probe --features custom-protocol --locked
          python scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe.exe --report .build/ci-native-audio-windows.json --runtime .build/package-stage/windows-x64/native
          cargo build -p cumulus-desktop --example main_flow_ui_probe --features custom-protocol --locked
          python scripts/ci/main_flow_smoke.py --binary .build/target/debug/examples/main_flow_ui_probe.exe --root .build/ci-main-flow-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/native_smoke.py --binary .build/target/debug/examples/native_audio_probe.exe --report .build/ci-native-audio-loudness-windows.json --runtime .build/package-stage/windows-x64/native --filter-library .build/package-stage/windows-x64/native/cumulus_audio_filter.dll
          cargo build -p cumulus-desktop --example equalizer_ui_probe --features custom-protocol --locked
          python scripts/ci/equalizer_live_smoke.py --binary .build/target/debug/examples/equalizer_ui_probe.exe --root .build/ci-equalizer-live-windows --runtime .build/package-stage/windows-x64/native --filter-library .build/package-stage/windows-x64/native/cumulus_audio_filter.dll
          cargo build -p cumulus-desktop --example loudness_ui_probe --features custom-protocol --locked
          python scripts/ci/loudness_ui_smoke.py --binary .build/target/debug/examples/loudness_ui_probe.exe --root .build/ci-loudness-ui-windows --runtime .build/package-stage/windows-x64/native --filter-library .build/package-stage/windows-x64/native/cumulus_audio_filter.dll
          cargo build -p cumulus-desktop --example login_interception_ui_probe --features custom-protocol --locked
          python scripts/ci/ui_smoke.py --binary .build/target/debug/examples/login_interception_ui_probe.exe --root .build/ci-login-windows
          python scripts/ci/ui_smoke.py --binary .build/target/debug/examples/login_interception_ui_probe.exe --root .build/ci-login-windows-legacy --legacy
          cargo build -p cumulus-desktop --example scroll_ui_probe --features custom-protocol --locked
          python scripts/ci/scroll_smoke.py --binary .build/target/debug/examples/scroll_ui_probe.exe --root .build/ci-scroll-windows
          cargo build -p cumulus-desktop --example ux_ui_probe --features custom-protocol --locked
          python scripts/ci/ux_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-ux-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/mode_ui_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-mode-ui-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/mode_ui_smoke.py --empty-fm --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-empty-fm-ui-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/fm_feedback_dialog_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-fm-feedback-dialog-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/fm_state_recovery_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-fm-state-recovery-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/fm_blacklist_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-fm-blacklist-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/queue_ui_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-queue-ui-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/queue_ui_smoke.py --locate --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-queue-locate-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/queue_selection_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-queue-selection-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/queue_click_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-queue-click-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/intelligence_ui_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-intelligence-ui-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/intelligence_start_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-intelligence-start-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/intelligence_cycle_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-intelligence-cycle-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/queue_collection_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-queue-collection-windows --runtime .build/package-stage/windows-x64/native
          cargo build -p cumulus-desktop --example queue_room_ui_probe --features custom-protocol --locked
          python scripts/ci/queue_room_smoke.py --binary .build/target/debug/examples/queue_room_ui_probe.exe --root .build/ci-queue-room-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-layout-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-page-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --table --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-table-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --batch --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-batch-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --navigation --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-navigation-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --mv-replay --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-mv-replay-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/download_page_smoke.py --menu --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-download-menu-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/player_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-player-layout-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playback_speed_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playback-speed-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playback_quality_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playback-quality-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/quality_trial_native_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-quality-trial-native-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/trial_seek_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-trial-seek-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/quality_rights_ui_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-quality-rights-ui-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/volume_ui_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-volume-ui-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playlist_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playlist-layout-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playlist_subscribers_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playlist-subscribers-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playlist_editor_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playlist-editor-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playlist_tags_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playlist-tags-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playlist_cover_layout_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playlist-cover-layout-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playlist_cover_feedback_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playlist-cover-feedback-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/playlist_cover_preview_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-playlist-cover-preview-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_smoke.py --exact-fallback --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-exact-fallback-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_smoke.py --suggestion-matches --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-suggestion-matches-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_smoke.py --history-last --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-history-last-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-results-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --v3 --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-v3-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --voice-direct --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-voice-direct-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --voice-queue --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-voice-queue-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --mv-play --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-mv-play-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --search-next --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-next-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --song-waterfall --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-song-waterfall-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --card-matches --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-card-matches-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --correction-original --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-correction-original-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_results_smoke.py --people-categories --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-people-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/effect_directory_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-effect-directory-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/daily_history_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-daily-history-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/style_home_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-style-home-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_cards_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-cards-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_preview_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-preview-windows --runtime .build/package-stage/windows-x64/native
          python scripts/ci/search_lyrics_smoke.py --binary .build/target/debug/examples/ux_ui_probe.exe --root .build/ci-search-lyrics-windows --runtime .build/package-stage/windows-x64/native
