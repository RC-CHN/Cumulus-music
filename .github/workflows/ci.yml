  linux-webview:
    name: Linux WebView smoke
    needs: [frontend, package-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libmpv-dev ffmpeg xvfb dbus-x11 python3-gi gir1.2-gtk-3.0 libxtst6 openbox x11-utils iproute2 openssl
          sudo locale-gen en_US.UTF-8
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          # Linux reuses downloads only, never a target directory.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-Linux-downloads-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-Linux-downloads-v2-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Same workflow run; no external run ID or cache lookup.
          name: linux-webview-package-runtime
          path: .build/package-stage/linux-x64/native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-webview-package-manifest
          path: .build/packages/linux-x64
      - name: Verify same-run Linux media runtime and measure WebView disk
        run: |
          test -f frontend/dist/index.html
          test -s .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
          test ! -L .build/package-stage/linux-x64/native/libcumulus_audio_filter.so
          flac_sha="$(PYTHONPATH=scripts/ci python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from linux_flac_artifacts import MAX_MANIFEST, verify_extracted
          from linux_flac150_package import bounded_file

          path = Path('.build/packages/linux-x64/manifest-linux-x64.json')
          bounded_file(path, MAX_MANIFEST)
          manifest = json.loads(path.read_text(encoding='utf-8'))
          actual = (manifest['platform'], manifest['commit'], manifest['ciRun'], manifest['ciAttempt'])
          expected = ('linux-x64', os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
          if actual != expected:
              raise ValueError('Linux media runtime is not from the exact package run and attempt')
          report = verify_extracted(Path('.build/package-stage/linux-x64/native'), manifest.get('flacDecoder'))
          print(report['sha256'])
          PY
          )"
          printf 'CUMULUS_CI_PACKAGED_FLAC_SHA256=%s\n' "$flac_sha" >> "$GITHUB_ENV"
          test ! -d .build/target
          df -h .
      - name: Verify the packaged Linux FLAC decoder through ordinary local equalizer playback
        run: |
          cargo build -p cumulus-desktop --example native_local_equalizer_probe --features custom-protocol --locked
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
            env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 \
            /usr/bin/python3 scripts/ci/native_local_equalizer_smoke.py --binary .build/target/debug/examples/native_local_equalizer_probe \
            --flac-library .build/package-stage/linux-x64/native/libcumulus_flac150.so.14 --flac-sha256 "$CUMULUS_CI_PACKAGED_FLAC_SHA256" \
            --filter-library .build/package-stage/linux-x64/native/libcumulus_audio_filter.so --frontend-dist frontend/dist --root .build/ci-native-local-equalizer-linux
      - name: Verify the local spatial controls on packaged Linux FLAC
        run: |
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
            env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 \
            /usr/bin/python3 scripts/ci/native_local_equalizer_smoke.py --spatial-controls-only --binary .build/target/debug/examples/native_local_equalizer_probe \
            --flac-library .build/package-stage/linux-x64/native/libcumulus_flac150.so.14 --flac-sha256 "$CUMULUS_CI_PACKAGED_FLAC_SHA256" \
            --frontend-dist frontend/dist --root .build/ci-native-spatial-controls-linux
      - name: Verify local PCM WAV spatial controls on Linux
        run: |
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
            env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 \
            /usr/bin/python3 scripts/ci/native_local_equalizer_smoke.py --spatial-wav-only --binary .build/target/debug/examples/native_local_equalizer_probe \
            --frontend-dist frontend/dist --root .build/ci-native-spatial-wav-linux
      - name: Verify local 48 kHz WAV and packaged FLAC spatial controls on Linux
        run: |
          verify_spatial_rate() {
            sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
              env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
              env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 \
              /usr/bin/python3 scripts/ci/native_local_equalizer_smoke.py --binary .build/target/debug/examples/native_local_equalizer_probe \
              --frontend-dist frontend/dist "$@"
          }
          verify_spatial_rate --spatial-wav-48k-only --root .build/ci-native-spatial-wav-48k-linux
          verify_spatial_rate --spatial-flac-48k-only \
            --flac-library .build/package-stage/linux-x64/native/libcumulus_flac150.so.14 \
            --flac-sha256 "$CUMULUS_CI_PACKAGED_FLAC_SHA256" --root .build/ci-native-spatial-flac-48k-linux
      - name: Verify indexed Linux FLAC and held fallback with the packaged decoder
        run: |
          export CUMULUS_FLAC_PROBE_LIBRARY="$PWD/.build/package-stage/linux-x64/native/libcumulus_flac150.so.14"
          cargo test -p cumulus-core --locked --lib indexed_large_flac_reframes_and_seek_discards_the_staged_suffix -- --ignored
          cargo test -p cumulus-core --locked --lib indexed_4608_flac_matches_1024_flac_and_wav_through_seek_and_tail -- --ignored
          sudo unshare --net --fork runuser -u "$(id -un)" -- xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            env -u AT_SPI_BUS_ADDRESS -u AT_SPI_DISPLAY -u NO_AT_BRIDGE dbus-run-session -- \
            env GDK_BACKEND=x11 LC_ALL=en_US.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_FORCE_DMABUF_RENDERER=1 WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 \
            /usr/bin/python3 scripts/ci/native_local_equalizer_smoke.py --indexed-flac-only --binary .build/target/debug/examples/native_local_equalizer_probe \
            --flac-library .build/package-stage/linux-x64/native/libcumulus_flac150.so.14 --flac-sha256 "$CUMULUS_CI_PACKAGED_FLAC_SHA256" \
            --frontend-dist frontend/dist --root .build/ci-indexed-flac-linux
      - name: Verify natural playback completion and live history settings on Linux
        run: |
          cargo build -p cumulus-desktop --example minibar_skip_ui_probe --example ux_ui_probe --features custom-protocol --locked
          outer_network=$(readlink /proc/self/ns/net)
