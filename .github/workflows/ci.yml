name: CI
run-name: Windows media worker comparison (no release artifacts)

on: workflow_dispatch

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  PYTHONIOENCODING: utf-8

jobs:
  compare:
    name: Cold FFmpeg build (${{ matrix.workers }} workers)
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workers: ['2', '4']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify and seed the pinned MSYS2 installer cache
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci/windows_msys2_bootstrap.py
      - name: Windows media dependencies
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ladspa-sdk
      - name: Install pinned toolchain
        run: rustup show
      - name: Build and verify Windows media runtime
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-media
        env:
          # A cold FFmpeg build can use all four hosted Windows cores.
          CUMULUS_MEDIA_BUILD_JOBS: ${{ matrix.workers }}
        with:
          msys-root: ${{ steps.msys2.outputs.msys2-location }}
          save-cache: 'false'
