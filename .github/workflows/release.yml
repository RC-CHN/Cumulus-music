name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (must match the unique release commit)'
        required: true
        type: string
      ci_run_id:
        description: 'Successful CI run on the exact release commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify CI artifacts and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release commit, complete CI and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python scripts/ci/publish.py --version "$RELEASE_VERSION" --run-id "$CI_RUN_ID" --publish
