name: Windows NLA runtime proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-nla:
    name: Passive local NLA snapshot
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check the isolated classifier and build the Win64 probe
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'A native Windows x64 runner is required'
          }
          $manifest = 'desktop/probes/windows-nla/Cargo.toml'
          $target = Join-Path $env:RUNNER_TEMP 'cumulus-windows-nla-target'
          cargo fmt --manifest-path $manifest -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Probe formatting failed' }
          cargo clippy --manifest-path $manifest --target-dir $target --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Probe Clippy failed' }
          cargo test --manifest-path $manifest --target-dir $target --locked
          if ($LASTEXITCODE -ne 0) { throw 'NLA call fixtures failed' }
          python -B -m unittest discover -s scripts/ci -p test_windows_nla_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Categorical report fixtures failed' }
          cargo build --manifest-path $manifest --target-dir $target --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Probe build failed' }
      - name: Run one local Windows NLA snapshot
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'cumulus-windows-nla-target'
          $binary = Join-Path $target 'release/windows-nla-snapshot.exe'
          $proof = Join-Path $env:RUNNER_TEMP 'cumulus-windows-nla-runtime.json'
          python -B scripts/ci/windows_nla_runtime.py --binary $binary --report $proof
          if ($LASTEXITCODE -ne 0) { throw 'Native NLA proof failed' }
      - name: Preserve categorical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-nla-runtime-proof
          path: ${{ runner.temp }}/cumulus-windows-nla-runtime.json
          if-no-files-found: warn
          retention-days: 7
