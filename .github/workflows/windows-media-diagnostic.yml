name: Windows media diagnostic
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  devices:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Windows media dependencies
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ladspa-sdk
      - run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target
          key: diagnostic-Windows-${{ github.sha }}
          restore-keys: |
            rust-Windows-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Build and verify Windows media runtime
        uses: ./.github/actions/windows-media
        with:
          msys-root: ${{ steps.msys2.outputs.msys2-location }}
      - run: cargo build -p cumulus-core --example engine_roundtrip --locked
      - name: Compare Rust, direct C ABI, and upstream enumeration
        env:
          CUMULUS_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python scripts/ci/windows_device_diagnostic.py
      - name: Preserve synthetic diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-device-diagnostic
          include-hidden-files: true
          path: |
            .build/windows-device-diagnostic/*.log
            .build/windows-device-diagnostic/runtime/third-party/msys2-packages.txt
          if-no-files-found: warn
