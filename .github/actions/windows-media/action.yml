name: Cumulus Windows media runtime
description: Build or restore the pinned FFmpeg runtime and verify its LADSPA filter
inputs:
  msys-root:
    description: UCRT64 installation prepared with the FFmpeg build dependencies
    required: true
runs:
  using: composite
  steps:
    - name: Identify exact Windows media build inputs
      id: plan
      shell: bash
      env:
        CUMULUS_MSYS2_ROOT: ${{ inputs.msys-root }}
      run: python scripts/ci/windows_media.py prepare --msys "$CUMULUS_MSYS2_ROOT"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      id: media-cache
      with:
        path: .build/windows-media/cache
        key: ${{ steps.plan.outputs.cache-key }}
    - name: Build the current native DSP for runtime verification
      shell: bash
      run: cargo build --locked -p cumulus-audio-filter --lib --example player_probe
    - name: Install and verify Windows LADSPA runtime
      shell: bash
      env:
        CUMULUS_MSYS2_ROOT: ${{ inputs.msys-root }}
      run: python scripts/ci/windows_media.py install --msys "$CUMULUS_MSYS2_ROOT"
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      if: steps.media-cache.outputs.cache-hit != 'true'
      with:
        path: .build/windows-media/cache
        key: ${{ steps.plan.outputs.cache-key }}
