[workspace]
members = ["core", "core/audio-filter", "desktop"]
default-members = ["core"]
resolver = "3"

[workspace.package]
version = "0.2.0-rc.2"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
cumulus-core = { path = "core" }
