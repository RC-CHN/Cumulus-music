required-features = ["custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[example]]
name = "watchman_events_probe"
required-features = ["custom-protocol"]

[[example]]
name = "watchman_fingerprint_probe"
required-features = ["custom-protocol"]

[[example]]
name = "watchman_collection_probe"
required-features = ["custom-protocol"]

[[example]]
name = "watchman_live_probe"
required-features = ["custom-protocol"]

[dependencies]
cumulus-core.workspace = true
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"
tokio = { version = "1", features = ["sync"] }
tempfile = "3"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = "=2.0.2"
gio = "=0.18.4"
libloading = "=0.7.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
tauri = { version = "2", features = ["test"] }

