[package]
name = "cumulus-desktop"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "cumulus_desktop"

[[bin]]
name = "cumulus"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
recognition-monitor-lab = []
signed-window-read-proof = ["cumulus-core/signed-window-read-proof"]

