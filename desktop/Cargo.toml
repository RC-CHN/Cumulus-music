[dependencies]
cumulus-core.workspace = true
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.2"
tokio = { version = "1", features = ["sync", "time"] }
tempfile = "3"
dirs = "6"
getrandom = "0.4"
tauri-plugin-clipboard-manager = "=2.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.10"
libc = "0.2"
webkit2gtk = "=2.0.2"
gtk = "=0.18.2"
gdkx11 = "=0.18.2"
gio = "=0.18.4"
libloading = "=0.7.4"
x11rb = { version = "=0.13.2", features = ["xkb"] }
xkeysym = "=0.2.1"

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "rt"] }
windows = { version = "=0.61.3", features = ["Foundation", "Media", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_Graphics_DirectWrite", "Win32_Globalization"] }
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
url = "2"
libloading = "=0.7.4"
rusqlite = { version = "0.41", features = ["bundled"] }
tauri = { version = "2", features = ["test", "unstable"] }

