[package]
name = "cumulus-windows-board-identity-probe"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "cumulus-windows-board-identity-probe"

[workspace]

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
