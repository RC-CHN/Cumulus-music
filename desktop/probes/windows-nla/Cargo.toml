[package]
name = "cumulus-windows-nla-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "windows-nla-snapshot"
path = "../../examples/windows_nla_snapshot.rs"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Com"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
