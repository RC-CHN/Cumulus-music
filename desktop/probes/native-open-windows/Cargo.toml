[package]
name = "cumulus-native-open-windows-lab"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["io-util", "net", "process", "rt", "time"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }
