[package]
name = "cumulus-windows-address-watch"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
