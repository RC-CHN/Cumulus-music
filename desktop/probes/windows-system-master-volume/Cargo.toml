[package]
name = "cumulus-windows-system-master-volume"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
